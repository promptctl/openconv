[package]
name = "openconv-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The voice agent that joins a conversation room and talks to the caller"

[dependencies]
openconv-protocol = { path = "../openconv-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tracing = "0.1"
# Brings its own libwebrtc: the first build downloads a prebuilt one and leaves a
# multi-gigabyte target directory. Same TLS caveat as livekit-api — the defaults give
# no TLS backend, and every wss:// connection then fails as if the host were down.
livekit = { version = "0.8", features = ["rustls-tls-native-roots"] }
libwebrtc = "0.3"
whisper-rs = "0.16"
futures-util = "0.3"
# Rust has no official Anthropic SDK, so the Claude client speaks the Messages API
# over HTTP directly. rustls rather than the platform stack, matching livekit.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
minimp3 = { version = "0.6", features = ["async_tokio"] }
# Silero VAD, weights and all, over an ONNX runtime the crate downloads at build time.
# The pure-Rust alternatives were tried first and one of them — silero-vad-pure, which
# advertises bit-faithfulness against this same model — scored 0.001 on every window of
# real speech that this scores 0.99 on. Verify any replacement against a recording
# before swapping it in; the seam for doing so is crates/openconv-agent/src/vad.rs.
voice_activity_detector = "0.2"
bytes = "1"
tokio-util = { version = "0.7.19", features = ["io"] }

# whisper-rs ships with no acceleration compiled in — its default feature set is empty,
# so inference runs on the CPU alone and lands well behind realtime, which for a
# conversation is the same as not working. Each platform names the backend it has;
# declared per-target because a feature that does not exist elsewhere is a build error
# elsewhere, and cargo unions these with the base dependency above.
#
# [LAW:one-type-per-behavior] Metal and CUDA are not two decisions, they are one — "the
# acceleration this target has" — instantiated twice. Every supported target must appear
# here, because a target that is merely absent still builds, and what it builds is the
# CPU-only inference this comment exists to forbid.
#
# Linux was that absent target until 2026-09-02, and it is the one openconv deploys on.
# whisper-rs sets `use_gpu: cfg!(feature = "_gpu")`, so the container came up with
# `use gpu = 0`, fell back to the CPU behind a WARN, reported itself healthy, and lost
# 97% of every caller's speech: inference stalled the listener for tens of seconds and
# the audio sink, which drops its oldest frames, discarded the front of every utterance.
# Nothing failed. It just did not work. See `Transcriber::load`, which now refuses to
# start rather than let that recur, and openconv-openconv-bwy.33.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
# CUDA rather than Vulkan: the deployment's card is an RTX 2070 on a host that already
# runs CUDA for Ollama, and the container gets the driver by way of the nvidia container
# runtime. The build needs nvcc, which is why the Dockerfile's build stage installs a
# CUDA toolkit and why a Linux build without one now fails at compile time — loudly, and
# before an image exists — instead of at 2am inside a call.
whisper-rs = { version = "0.16", features = ["cuda"] }

# The VAD's ONNX Runtime, reached only through voice_activity_detector — named here
# solely to choose how it is linked.
#
# ort-sys and webrtc-sys each bundle their own protobuf and abseil. Apple's linker takes
# the first definition of a duplicate symbol and moves on; rust-lld on Linux refuses,
# and the build that succeeds on the development machine fails at the link step with
# several hundred `duplicate symbol: google::protobuf::…` errors. `load-dynamic` takes
# ONNX Runtime out of the static link entirely — it is dlopen'd from ORT_DYLIB_PATH at
# startup instead — so only one copy of protobuf is ever linked in.
#
# Linux-only because the cost is a shared library that has to be shipped beside the
# binary, which the container image does and a `cargo run` from a checkout does not.
ort = { version = "=2.0.0-rc.10", features = ["load-dynamic"] }
