[package]
name = "openconv-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The voice agent that joins a conversation room and talks to the caller"

[dependencies]
openconv-protocol = { path = "../openconv-protocol" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tracing = "0.1"
# Brings its own libwebrtc: the first build downloads a prebuilt one and leaves a
# multi-gigabyte target directory. Same TLS caveat as livekit-api — the defaults give
# no TLS backend, and every wss:// connection then fails as if the host were down.
livekit = { version = "0.8", features = ["rustls-tls-native-roots"] }
libwebrtc = "0.3"
whisper-rs = "0.16"
futures-util = "0.3"
# Rust has no official Anthropic SDK, so the Claude client speaks the Messages API
# over HTTP directly. rustls rather than the platform stack, matching livekit.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
minimp3 = { version = "0.6", features = ["async_tokio"] }
# Silero VAD, weights and all, over an ONNX runtime the crate downloads at build time.
# The pure-Rust alternatives were tried first and one of them — silero-vad-pure, which
# advertises bit-faithfulness against this same model — scored 0.001 on every window of
# real speech that this scores 0.99 on. Verify any replacement against a recording
# before swapping it in; the seam for doing so is crates/openconv-agent/src/vad.rs.
voice_activity_detector = "0.2"
bytes = "1"
tokio-util = { version = "0.7.19", features = ["io"] }

# whisper-rs ships with no acceleration compiled in — its default feature set is empty,
# so inference runs on the CPU alone and lands well behind realtime, which for a
# conversation is the same as not working. Metal is the one that matters on Apple
# Silicon. Declared per-target because the feature does not exist elsewhere; cargo
# unions it with the base dependency above.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
