name: Publish the openconv image

# Builds openconv's image from a commit the runner fetched itself, publishes it to the
# homelab registry under a `YYYY.MM.DD.N` tag and `:latest`, and refuses to report
# success until the registry can be read back and shown to hold exactly what was pushed
# (openconv-deploy-690.3).
#
# The first job proves the builder; the second uses it. They are separate because the
# proof is worth having on a commit that will not be published — a Dockerfile change on
# a branch gets its BuildKit requirements checked here, before merge, rather than at the
# far end of a cold build on master.
#
# Why this exists at all: openconv's image used to be built by tarring a working tree
# over SSH to a homelab node (scripts/build-image.sh), which produced images whose source
# no commit could name. See CLAUDE.md. The replacement must run where nothing outside the
# network can reach in — this repo pushes to Gitea and the self-hosted act_runner polls
# outbound, so no inbound connection exists at any point (home-infra/CLAUDE.md: "No
# inbound internet exposure, ever").

# Pushing to the Gitea remote IS the trigger. openconv is developed on GitHub, which
# cannot reach this network and must not drive anything inside it; a build happens when
# someone deliberately pushes the commit they want built to gitea.sanctuary.gdn, the only
# side that can reach the registry. No branch filter — pushing a ref here is the request
# to check that ref, and which refs additionally get *published* is the `publish` job's
# own condition below.
#
# workflow_dispatch takes no inputs, and that is the design rather than an omission. The
# one thing this workflow must never accept is an instruction about where its source
# comes from: a path input, a "build this directory" override, or anything else that
# would let a run publish an image no commit names. There is no such input to refuse
# because there is no input at all. [LAW:types-are-the-program]
on:
  push:
  workflow_dispatch:

# [LAW:no-ambient-temporal-coupling] act_runner runs `capacity: 4` against a single
# Docker daemon whose BuildKit cache mounts are shared mutable state. Ordering is owned
# here rather than left to whenever two runs happen to arrive. It is also what keeps the
# registry read that picks N from racing another run's push — though the verification at
# the end of `publish` is what makes a lost race loud, rather than trusting this alone.
concurrency:
  group: openconv-builder
  cancel-in-progress: false

env:
  # The registry as the cluster's Docker daemons name it — trusted cluster-wide via
  # insecure-registries in home-infra/modules/docker/default.nix. The HTTPS name
  # registry.sanctuary.gdn is the same store behind Caddy; every read here goes to the
  # one a build actually pushes to, so the tag count and the verification are answered by
  # the same store the push landed in and cannot disagree with it.
  REGISTRY: 192.168.7.208:5000
  IMAGE: openconv

jobs:
  reachability:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4

      - name: Assert the source is the commit the event named
        uses: ./.gitea/actions/assert-source-is-event-commit

      # The image is x86_64 Linux. A runner of any other architecture would build a
      # silently-wrong image, or fall into hours of emulation — the exact failure the
      # old SSH-to-a-build-host script existed to dodge.
      - name: Assert the builder matches the image's target platform
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          # /proc/meminfo rather than `free`: procps is not in every job image, and a
          # capacity report that vanishes with the container's base image is no report.
          echo "runner: $(uname -s) $arch, $(nproc) cpu, $(awk '/^MemTotal:/{print int($2/1024)}' /proc/meminfo)MB ram"
          df -h / | tail -1
          if [ "$arch" != "x86_64" ]; then
            echo "ERROR: builder is $arch; openconv's image is x86_64 Linux." >&2
            exit 1
          fi

      # BuildKit is not optional for this repo: the Dockerfile declares
      # `# syntax=docker/dockerfile:1.7` and uses heredoc RUN blocks plus
      # --mount=type=cache. The legacy builder fails on all three. Proving the daemon
      # is reachable AND BuildKit-capable here means the publish job fails on the build
      # itself rather than on the builder it was handed.
      - name: Assert a BuildKit-capable Docker daemon is reachable
        run: |
          set -euo pipefail
          docker version --format 'daemon {{.Server.Version}}'
          # Exercising the features rather than asking whether a plugin is installed:
          # a `buildx version` that succeeds still says nothing about whether THIS
          # daemon resolves a syntax frontend, honours a cache mount, or parses a
          # heredoc.
          #
          # [LAW:one-source-of-truth] Which frontend, and which mount kinds, are read
          # out of the real Dockerfile rather than restated here. A probe holding its
          # own copy of "what the build needs" goes stale the first time the Dockerfile
          # gains a feature, and stays green while the real build breaks on it.
          if ! head -n 1 Dockerfile | grep -q '^# syntax='; then
            echo "ERROR: Dockerfile line 1 is not a syntax directive, so this probe" >&2
            echo "       cannot know which frontend the real build resolves." >&2
            exit 1
          fi
          syntax="$(head -n 1 Dockerfile)"

          # Run-scoped tag: act_runner's capacity is 4, so a fixed name lets two
          # concurrent runs remove each other's image mid-build.
          probe="$(mktemp -d)"
          tag="openconv-buildkit-probe:${GITHUB_RUN_ID}"

          # This is the step designed to fail whenever BuildKit is misconfigured, so its
          # failure path is a normal case rather than an exceptional one — and `set -e`
          # aborts past any cleanup written after the build. The trap runs on every exit
          # path instead. It reports an image that was already gone rather than
          # silencing the attempt: a quiet cleanup is how a leak stops being visible,
          # and this runner's disk is the same scarce resource the real build needs.
          cleanup_probe() {
            rm -rf "$probe"
            docker image rm -f "$tag" >/dev/null \
              || echo "note: probe image $tag was not present to remove" >&2
          }
          trap cleanup_probe EXIT

          {
            echo "$syntax"
            cat <<'PROBE'
          FROM busybox
          RUN --mount=type=cache,target=/probe-cache <<'SHELL'
          set -eu
          echo buildkit-ok > /probe-cache/marker
          cat /probe-cache/marker
          SHELL
          PROBE
          } > "$probe/Dockerfile"

          # [LAW:one-source-of-truth] Both sides are READ, neither is written down. What
          # the build needs comes from the real Dockerfile; what the probe covers comes
          # from the probe just generated above — same extractor, two inputs. A ledger of
          # covered kinds would be a third claim that drifts from both, and the drift is
          # not hypothetical: a maintainer meeting the failure below would satisfy a
          # ledger by adding a word to it, leaving the daemon unchecked for the feature
          # that failed. There is no word to add here — the only way to cover a kind is
          # to make the probe exercise it.
          #
          # Selecting the --mount tokens first and reading type= out of each finds the
          # kind wherever it sits among the comma-separated keys; matching
          # `--mount=type=` in one pattern only sees it when written first.
          # Total over --mount tokens, not just over the ones that spell type=. BuildKit
          # defaults a mount with no type= key to bind, so an extractor that only sees
          # the literal string contributes nothing for `--mount=source=.,target=/x` —
          # and because both sides use this same function, such a mount would never
          # enter the required set at all. A guard that asks no question always passes,
          # which is the quietest way for this check to become decorative.
          # awk rather than a sed `t` branch: BSD sed reads `t;` as a label name and
          # errors, so that spelling works on this Linux runner and breaks for anyone
          # running the check on a Mac. The extractor is the part most likely to be
          # tried by hand when it rejects something.
          mount_kinds() {
            grep -oE -- '--mount=[^[:space:]]+' "$1" \
              | awk '{
                  if (match($0, /[=,]type=[a-z]+/))
                    print substr($0, RSTART + 6, RLENGTH - 6)
                  else
                    print "bind"
                }' \
              | sort -u
          }

          covered=" $(mount_kinds "$probe/Dockerfile" | tr '\n' ' ')"
          echo "probe exercises:$covered"
          for kind in $(mount_kinds Dockerfile); do
            case "$covered" in
              *" $kind "*) ;;
              *)
                echo "ERROR: Dockerfile uses --mount=type=$kind, which the probe does not" >&2
                echo "       exercise, so this daemon was never checked for it. Add a RUN" >&2
                echo "       using type=$kind to the probe above." >&2
                exit 1
                ;;
            esac
          done

          DOCKER_BUILDKIT=1 docker build --progress=plain -t "$tag" "$probe"

      # [LAW:no-silent-failure] The registry answering at all is not the property that
      # matters — the property is that it answers as a registry. A Caddy error page or
      # a captive portal returns a 200 body just as happily, so the response is
      # required to carry the API version header the /v2/ endpoint is defined to send.
      - name: Assert the registry answers as a registry
        run: |
          set -euo pipefail
          headers="$(curl -sS --fail --max-time 20 -D - -o /dev/null "http://$REGISTRY/v2/")"
          echo "$headers"
          if ! grep -qi '^docker-distribution-api-version:' <<<"$headers"; then
            echo "ERROR: $REGISTRY/v2/ answered without a Docker-Distribution-API-Version" >&2
            echo "       header, so whatever replied is not the registry." >&2
            exit 1
          fi

      # A read proves routing; only a write proves the builder can publish. This
      # opens an upload session and immediately cancels it, so it exercises the write
      # path without leaving a blob behind. A registry that accepts reads but refuses
      # writes would otherwise be discovered mid-build, after the expensive part.
      - name: Assert the builder may write to the registry
        run: |
          set -euo pipefail
          location="$(curl -sS --fail --max-time 20 -X POST -D - -o /dev/null \
            "http://$REGISTRY/v2/$IMAGE/blobs/uploads/" | tr -d '\r' \
            | awk 'tolower($1) == "location:" { print $2 }')"

          # [LAW:dataflow-not-control-flow] The spec lets Location come back either
          # absolute or as a bare path, and a registry may name itself differently than
          # we dialled it. Stripping ANY scheme+authority — not only the one assumed —
          # normalises both spellings through one expression, leaving a bare path
          # untouched. Matching only the expected host would degrade to a no-op and
          # build a malformed URL from the leftover.
          path="$(printf '%s' "$location" | sed -E 's#^[a-zA-Z][a-zA-Z0-9+.-]*://[^/]*##')"

          # The trap goes up here, before the session is validated rather than after.
          # curl returned 2xx, so the registry HAS opened a session by this line; every
          # exit below it — including the one for a Location we could not parse — has to
          # cancel. Installing it after the check left the single path where the session
          # is hardest to account for as the one path that never cleaned up.
          #
          # This workflow runs on every push, and a cancel skipped by an abort or by the
          # runner losing the network accumulates orphaned uploads on a registry with
          # 13G free. The trap says so when the cancel does not take, rather than
          # leaving a silent orphan.
          cleanup_upload() {
            # Two real states, each reported honestly. An unparseable Location leaves
            # nothing this script can address, so it says that rather than firing a
            # DELETE at the registry root — a request that means nothing, fails, and
            # reports a blank session id beside the error that already explained it.
            if [ -z "$path" ]; then
              echo "note: no cancellable upload session was parsed; registry GC must reap it" >&2
              return
            fi
            curl -sS --fail --max-time 20 -X DELETE "http://$REGISTRY$path" \
              || echo "note: upload session $path was not cancelled; registry GC must reap it" >&2
          }
          trap cleanup_upload EXIT

          # Now safe to reject: the trap above already owns whatever was opened. A
          # session whose Location we could not parse is one we cannot address, so this
          # says that plainly instead of implying it was cleaned up.
          if [ -z "$path" ]; then
            echo "ERROR: the registry opened an upload session but named none this" >&2
            echo "       script could parse. It cannot be cancelled from here and must" >&2
            echo "       be reaped by registry GC." >&2
            exit 1
          fi

          echo "upload session opened at $path"

      - name: Summary
        run: |
          echo "builder fetched ${GITHUB_SHA} itself, is x86_64 with BuildKit,"
          echo "and can both read and write ${REGISTRY}."

  publish:
    needs: reachability
    runs-on: ubuntu-latest

    # Which commits become published images, stated once.
    #
    # `master` because a dated tag is a permanent claim about a commit: a branch can be
    # force-pushed or deleted, and a published `2026.08.31.3` whose commit no longer
    # exists on any ref is precisely an image whose source cannot be named — the failure
    # this epic exists to end, reintroduced by a more respectable route. Dispatch because
    # a human choosing a ref by hand is the deliberate act the ban was always about
    # distinguishing from an accident.
    #
    # Everything else gets `reachability` and no image, which is also what keeps
    # `:latest` honest: a break-glass `nomad job run` with no `-var` lands on `:latest`
    # (home-infra/jobs/openconv.nomad.hcl declares `image_tag` defaulting to it), so an
    # experimental branch that could move that alias would put an unreviewed build one
    # outage away from production.
    #
    # The branch is written out rather than read from `github.event.repository.default_branch`
    # because an expression that resolves to empty on some event shape is false, and a
    # false condition here publishes nothing and says nothing — the one failure mode this
    # workflow must not have. If the default branch is ever renamed, this line moves with it.
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' }}

    outputs:
      image-tag: ${{ steps.tag.outputs.image-tag }}

    steps:
      - name: Check out the commit to build
        uses: actions/checkout@v4

      # This job builds from its own checkout, so it proves its own provenance. The
      # assertion in `reachability` was about a different workspace and carries nothing
      # here. [LAW:parse-dont-validate] — the commit is checked at the one boundary where
      # source enters this job, and nothing downstream re-asks.
      - name: Assert the source is the commit the event named
        uses: ./.gitea/actions/assert-source-is-event-commit

      # ---------------------------------------------------------------------------
      # The tag.
      #
      # `YYYY.MM.DD.N` is the homelab's format (home-infra docs/service-versions.md):
      # sortable, and the date says when a bad version was cut.
      #
      # [LAW:one-source-of-truth] N comes from what the registry has already published,
      # not from `github.run_number` the way homelab-infra's gen-image-tag action derives
      # it. The registry is the authority on which tags exist; run_number is a second
      # count kept in Gitea's database, and it resets when a workflow file is renamed or
      # a repo is recreated — after which a build silently overwrites a published image
      # under a tag someone has already deployed. Reading the registry cannot collide,
      # and it makes N mean "the Nth openconv image published today" rather than "some
      # run number", which is visibly not what it means elsewhere in the fleet
      # (happy-server holds 2026.08.23.32, .33 and .35 — the gaps are other repos' runs).
      # ---------------------------------------------------------------------------
      - name: Resolve the next tag from what the registry has published
        id: tag
        run: |
          set -euo pipefail

          # The runner's zone, not UTC, to match gen-image-tag: the rest of the fleet's
          # tags are cut that way and openconv-deploy-690.5 files this string into the
          # same service-versions contract they do.
          today="$(date +%Y.%m.%d)"
          today_re="${today//./\\.}"

          body="$(mktemp)"
          code="$(curl -sS --max-time 30 -o "$body" -w '%{http_code}' \
            "http://$REGISTRY/v2/$IMAGE/tags/list")"

          # [LAW:no-silent-failure] A missing repository is the first build and is fine.
          # Everything else — the registry down, a proxy in the way, a 500 — must not
          # read as "first build" and restart the numbering over tags that already
          # exist, quietly overwriting them.
          case "$code" in
            200) ;;
            404)
              if ! grep -q NAME_UNKNOWN "$body"; then
                echo "ERROR: $REGISTRY answered 404 for the tag list, but not the" >&2
                echo "       NAME_UNKNOWN that means no image has been published:" >&2
                cat "$body" >&2
                exit 1
              fi
              ;;
            *)
              echo "ERROR: $REGISTRY answered $code for the tag list:" >&2
              cat "$body" >&2
              exit 1
              ;;
          esac

          # `tags` comes back as a JSON array, or as null for a repository that exists
          # with nothing published — the state openconv is in right now, left behind by
          # the reachability job's upload probe. tr and sed both succeed on no matches,
          # so that case leaves `highest` empty; a grep in this position would exit 1 and
          # take the whole pipeline down under pipefail on exactly the first build.
          highest="$(tr ',[]' '\n\n\n' < "$body" | tr -d '"' \
            | sed -nE "s/^$today_re\.([0-9]+)$/\1/p" | sort -n | tail -n 1)"

          tag="$today.$(( ${highest:-0} + 1 ))"
          echo "publishing as $tag"
          echo "image-tag=$tag" >> "$GITHUB_OUTPUT"

      # Tagged `latest` alongside the dated tag in the same build, so the alias can only
      # ever name an image that was actually produced here.
      - name: Build and push
        env:
          TAG: ${{ steps.tag.outputs.image-tag }}
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build --progress=plain \
            --tag "$REGISTRY/$IMAGE:$TAG" \
            --tag "$REGISTRY/$IMAGE:latest" \
            .
          docker push "$REGISTRY/$IMAGE:$TAG"
          docker push "$REGISTRY/$IMAGE:latest"

      # A push that reported success and left nothing behind is a deploy that fails
      # minutes later on an image pull, far from here and hard to trace back — which is
      # why the script this replaces read the manifest afterwards, and why that behaviour
      # is carried over.
      #
      # It is carried over *strengthened*: the check is not "a manifest exists" but "the
      # manifest is the one this run built", compared by digest. Existence alone is
      # satisfied by another run that won the same tag, and by a `:latest` still pointing
      # at last week's build because a push was silently dropped — both of which look
      # exactly like success to a check that only asks whether something is there.
      - name: Verify the registry holds what this run pushed
        env:
          TAG: ${{ steps.tag.outputs.image-tag }}
        run: |
          set -euo pipefail

          # What the daemon recorded when the registry acknowledged the push. Both tags
          # name one image, so this is one digest listed twice.
          pushed="$(docker image inspect \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' "$REGISTRY/$IMAGE:$TAG" \
            | sed -n 's/.*@//p' | sort -u)"
          if [ "$(printf '%s' "$pushed" | grep -c .)" != 1 ]; then
            echo "ERROR: the daemon reports $(printf '%s' "$pushed" | grep -c .) digests" >&2
            echo "       for $REGISTRY/$IMAGE:$TAG, so there is no single image to" >&2
            echo "       verify against: $pushed" >&2
            exit 1
          fi
          echo "pushed digest: $pushed"

          # Every media type the daemon might have written, so a manifest that exists is
          # never reported as absent merely because this request did not ask for its
          # kind.
          registry_digest() {
            curl -sS --fail --max-time 60 -I \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              "http://$REGISTRY/v2/$IMAGE/manifests/$1" \
              | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }'
          }

          # [LAW:dataflow-not-control-flow] The dated tag and the alias are two values
          # through one check, not two checks — so the alias can never be the one that
          # quietly goes unverified.
          for ref in "$TAG" latest; do
            found="$(registry_digest "$ref")" || {
              echo "ERROR: $REGISTRY did not serve a manifest for $IMAGE:$ref after a" >&2
              echo "       push that claimed to succeed." >&2
              exit 1
            }
            if [ "$found" != "$pushed" ]; then
              echo "ERROR: $IMAGE:$ref resolves to ${found:-<no digest header>}, not to" >&2
              echo "       the $pushed this run built. Another build won the tag, or the" >&2
              echo "       push did not land." >&2
              exit 1
            fi
            echo "verified $REGISTRY/$IMAGE:$ref -> $found"
          done

          echo "published $REGISTRY/$IMAGE:$TAG (also :latest) from ${GITHUB_SHA}"
